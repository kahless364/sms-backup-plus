apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.zegoggles.smssync'
    compileSdkVersion 29
    buildToolsVersion '29.0.2'
    defaultConfig {
        applicationId 'com.zegoggles.smssync'
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1602
        versionName '1.6.0-BETA2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildFeatures {
        // AGP 8 disables BuildConfig generation by default; re-enable since the
        // app uses BuildConfig.DEBUG in DonationActivity and App.java.
        buildConfig true
    }

    buildTypes {
        release {
            // Minification enabled to exercise R8 full-mode (AGP 8 default)
            // and validate ProGuard keep rules are correct (AC-12).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystoreProperties.isEmpty() ? null : signingConfigs.release
        }
    }

    lint {
        // http://google.github.io/android-gradle-dsl/current/com.android.build.gradle.internal.dsl.LintOptions.html#com.android.build.gradle.internal.dsl.LintOptions
        warningsAsErrors true
        baseline file('lint-baseline.xml')
        // ExpiredTargetSdkVersion fires in AGP 8 when targetSdk < 33. targetSdk 29 is
        // a pre-existing condition being fixed in S3 (U-003); suppressed here so the
        // S2 toolchain-only upgrade does not add a baseline entry. Remove this line
        // when targetSdk 35 is set in S3.
        disable 'ExpiredTargetSdkVersion'
        // GradleDependency fires in AGP 8 for compileSdkVersion 29. compileSdk 29
        // is held at 29 through S2 per DES-MODERNIZATION-001 staging design;
        // raised to 35 in S3 (U-003). Remove this line when compileSdk 35 is set.
        disable 'GradleDependency'
        // UnsafeImplicitIntentLaunch is a new AGP 8 check (auth redirect flow). The
        // OAuth redirect intents are app-internal and expected behaviour; flagging for
        // future hardening in a dedicated auth story.
        disable 'UnsafeImplicitIntentLaunch'
        // UnsafeProtectedBroadcastReceiver is a new AGP 8 check for MmsReceiver and
        // SmsReceiver. Both check intent data inside their dispatch chains. These
        // receivers are removed by MU-005 (WorkManager migration); suppressed here.
        disable 'UnsafeProtectedBroadcastReceiver'
    }

    //  avoid "Duplicate files copied in APK META-INF/"
    // Note: packagingOptions is deprecated in AGP 8 (renamed to packaging{}) but
    // still accepted. Kept as-is to minimise S2 diff surface; rename in S3 cleanup.
    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup:otto:1.3.8'
    implementation 'com.github.jberkel.k-9:k9mail-library:eaf689025e'
    implementation 'com.android.billingclient:billing:2.1.0'
    implementation 'com.firebase:firebase-jobdispatcher:0.8.6'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'androidx.core:core-role:1.0.0-beta01'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.robolectric:robolectric:4.3.1'
    testImplementation "com.google.truth:truth:0.39"
    testImplementation 'org.mockito:mockito-all:1.10.17'

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.0-rc4'
}

tasks.withType(JavaCompile) {
    if (!it.name.toLowerCase().contains('test')) {
        options.compilerArgs = ['-Werror', '-Xlint:unchecked', '-Xlint:deprecation']
    }
}

// Robolectric 4.3.1 requires --add-opens on JDK 17 because it uses deep
// reflection to access JDK internals that became inaccessible in Java 9+.
// These flags are removed when Robolectric is upgraded to 4.12.x in S3
// (U-003 / DES-MODERNIZATION-003).
tasks.withType(Test).configureEach {
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.security=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED',
            '--add-opens=java.base/sun.reflect.misc=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED',
            '--add-opens=jdk.unsupported/sun.reflect=ALL-UNNAMED',
            '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
            '-Djdk.attach.allowAttachSelf=true',
            '--add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED',
            '--add-opens=java.base/sun.reflect=ALL-UNNAMED'
}
