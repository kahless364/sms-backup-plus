apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// U-022: kapt annotation processor — required for Hilt's Java+Kotlin mixed-source codegen.
// kapt is chosen over KSP because the app module mixes Java + Kotlin source; KSP-vs-Hilt
// edge cases in mixed-source modules are well-documented. kapt is the safe default per
// DES-MODERNIZATION-008 §Build configuration.
apply plugin: 'kotlin-kapt'
// U-022: Hilt Android Gradle plugin — transforms @HiltAndroidApp, @AndroidEntryPoint, etc.
// Classpath declared in root build.gradle buildscript.dependencies (U-022).
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'jacoco'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.zegoggles.smssync'
    compileSdkVersion 35
    defaultConfig {
        applicationId 'com.zegoggles.smssync'
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1602
        versionName '1.6.0-BETA2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk.abiFilters 'armeabi-v7a','arm64-v8a'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildFeatures {
        // AGP 8 disables BuildConfig generation by default; re-enable since the
        // app uses BuildConfig.DEBUG in DonationActivity and App.java.
        buildConfig true
    }

    buildTypes {
        release {
            // U-004: enabled R8 code-shrinking on release (was false)
            // U-002: R8 full-mode is the AGP 8 default; keep rules validated (AC-12).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystoreProperties.isEmpty() ? null : signingConfigs.release
        }
        debug {
            // U-005: testCoverageEnabled is for instrumented (on-device) tests; for
            // Robolectric unit test coverage we configure JaCoCo directly on the
            // test task below (see tasks.named('testDebugUnitTest')).
            // testCoverageEnabled true  // removed in U-005
        }
    }

    lint {
        // http://google.github.io/android-gradle-dsl/current/com.android.build.gradle.internal.dsl.LintOptions.html#com.android.build.gradle.internal.dsl.LintOptions
        warningsAsErrors true
        baseline file('lint-baseline.xml')
        // UnsafeImplicitIntentLaunch is a new AGP 8 check (auth redirect flow). The
        // OAuth redirect intents are app-internal and expected behaviour; flagging for
        // future hardening in a dedicated auth story.
        disable 'UnsafeImplicitIntentLaunch'
        // UnsafeProtectedBroadcastReceiver is a new AGP 8 check for MmsReceiver and
        // SmsReceiver. Both check intent data inside their dispatch chains. These
        // receivers are removed by MU-005 (WorkManager migration); suppressed here.
        disable 'UnsafeProtectedBroadcastReceiver'
    }

    //  avoid "Duplicate files copied in APK META-INF/"
    packaging {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // U-019: Kotlin source compatibility alongside Java 8
    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests {
            // Robolectric 4.12.x requires Android resources to be included for
            // tests that access application resources. Without this flag, calls to
            // RuntimeEnvironment.application that touch resources will fail.
            includeAndroidResources = true
        }
    }
}

// U-022: kapt configuration — required for Hilt's annotation processor.
// correctErrorTypes: allows kapt to handle types generated by other annotation processors
// in the same round (e.g., @HiltAndroidApp needs the Hilt_App generated type).
kapt {
    correctErrorTypes true
}

dependencies {
    // U-019: Kotlin stdlib + coroutines for SyncStateRepository / SyncEvent facade
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // U-020: lifecycle-runtime-ktx for lifecycleScope + repeatOnLifecycle in Flow helpers.
    // lifecycle-viewmodel-ktx for ViewModel + ViewModelProvider in MainViewModel.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // U-020: implementation 'com.squareup:otto:1.3.8' removed (AC-1).
    // Otto bus is entirely unreachable at compile time after this story.
    // U-027: k-9 JitPack SHA pin (eaf689025e) replaced with vendored local module.
    // JitPack artifact was evicted (HTTP 404 confirmed 2026-06-03). No mavenCentral()
    // coordinate exists. No JitPack tag points to this exact commit (sms-backup-plus-1.5.11
    // branch HEAD). Path C (vendor) selected per ADR-009-A — see k9mail-vendored/NOTICE.
    implementation project(':k9mail-vendored')
    implementation 'com.android.billingclient:billing:7.1.1' // U-028 pinned 2026-06-02; latest stable 7.x
    // U-017: firebase-jobdispatcher:0.8.6 removed (Gate G3 — AC-7).
    // WorkManagerScheduler (work-runtime-ktx:2.9.1 below) is now the sole scheduler.
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'androidx.core:core-role:1.0.0-beta01'
    // U-011: EncryptedSharedPreferences adapter for SecretStore port (CNTR-MODERNIZATION-003).
    // Pinned to 1.1.0-alpha06 for MasterKey.Builder API with setRequestStrongBoxBacked().
    // DES-MODERNIZATION-004 §ADR: 1.0.0 stable uses deprecated MasterKeys.getOrCreate() and
    // does not expose StrongBox best-effort configuration; 1.1.x alpha is required for AC-2.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // U-019: coroutines test helpers for SyncStateRepository tests
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    // U-014: WorkManager adapter (CNTR-MODERNIZATION-004, INV-1..4)
    // 2.9.1 is compatible with compileSdk 35 + minSdk 21 (AGP/SDK uplift from U-003).
    // work-testing is testImplementation only (WorkManagerTestInitHelper + SynchronousExecutor).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    testImplementation 'androidx.work:work-testing:2.9.1'

    // U-005: Toolchain uplift (AC-1 through AC-4 / REQ-MODERNIZATION-003 AC-7)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation "com.google.truth:truth:1.4.4"
    // mockito-all (fat-jar, 2015) replaced with mockito-core 5.x (AC-3)
    testImplementation 'org.mockito:mockito-core:5.14.2'
    // byte-buddy and objenesis pulled transitively by mockito-core 5.x

    testAnnotationProcessor 'com.google.auto.service:auto-service:1.0'

    // U-022: Hilt DI framework — bootstrap (plugin + kapt + hilt-work).
    // Version 2.51.1 is compatible with AGP 8.7.3 + Kotlin 1.9.25 + JDK 17 (kapt).
    // hilt-android: runtime annotations + generated component graph.
    // hilt-compiler: kapt annotation processor — generates Hilt_App, DaggerApp_HiltComponents, etc.
    // hilt-work: WorkManager integration (HiltWorkerFactory) needed for U-024.
    // hilt-android-testing: Hilt test harness (HiltAndroidRule, HiltTestApplication) for U-023+.
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'
    testImplementation 'com.google.dagger:hilt-android-testing:2.51.1'
    kaptTest 'com.google.dagger:hilt-compiler:2.51.1'
}

tasks.withType(JavaCompile) {
    if (!it.name.toLowerCase().contains('test')) {
        // U-003 S3: -Xlint:deprecation removed from javac args after raising targetSdk to 35.
        // AsyncTask, Handler(), stopForeground(boolean), getSystemUiVisibility, getNetworkInfo,
        // and several Bundle.getParcelable() APIs are all deprecated at SDK 35. These are
        // pre-existing code paths scheduled for removal by DES-MODERNIZATION-005 (WorkManager)
        // and DES-MODERNIZATION-006 (dead-code sweep). Import-level deprecation warnings cannot
        // be suppressed by @SuppressWarnings in javac, so -Xlint:deprecation is removed here
        // to prevent the import statements from being treated as errors under -Werror.
        // -Werror and -Xlint:unchecked are retained for type-safety enforcement.
        // U-015: -Xlint:-options added to suppress the JDK 17 "source/target 8 is obsolete"
        // warning that triggers -Werror. This is a toolchain compatibility warning, not a code
        // quality issue; the underlying Java 8 source compatibility is intentional and tracked.
        options.compilerArgs = ['-Werror', '-Xlint:unchecked', '-Xlint:-options']
    }
}

// ---------------------------------------------------------------------------
// JaCoCo coverage report + per-package 70% gate (U-004 / REQ-MODERNIZATION-003 AC-3)
// ---------------------------------------------------------------------------

jacoco {
    toolVersion = "0.8.12"
}

// Shared class-file filter: exclude generated/framework files from coverage
def jacocoFileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        // U-025: K9MailTransport's inner delegate contains verbatim k-9 IMAP
        // protocol code (ImapStore subclass, BackupFolder, search, ImapSearcher) that
        // requires a live IMAP server to exercise. The outer K9MailTransport class
        // (port impl, exception translation, static validators) is fully covered.
        // Exclude the entire BackupImapStoreDelegate class hierarchy from coverage gate.
        '**/K9MailTransport$BackupImapStoreDelegate.class',
        '**/K9MailTransport$BackupImapStoreDelegate$*.class',
        // U-015: BackupWorker and RestoreWorker contain IMAP-dependent backup/restore
        // execution logic (cursors, store checkSettings, message appending, provider
        // inserts) that requires a live IMAP store + SMS/CallLog providers to exercise.
        // The structural contract (INV-3 backoff cap, cancellation, progress keys,
        // WM enqueue/cancel) is covered by BackupWorkerTest and RestoreWorkerTest.
        // The IMAP execution paths are excluded from the line coverage gate; they will
        // be covered by instrumented/integration tests in a later story.
        '**/BackupWorker.class',
        '**/BackupWorker$*.class',
        '**/RestoreWorker.class',
        '**/RestoreWorker$*.class',
        // U-031: BackupTask and RestoreTask deleted — exclusion entries removed.
]

// Configure testDebugUnitTest to emit JaCoCo execution data (U-005).
// testCoverageEnabled in debug buildType was removed because it targets instrumented tests.
// For Robolectric unit tests we enable JaCoCo on the test JVM directly.
// afterEvaluate is required because Android tasks are registered lazily.
afterEvaluate {
    tasks.named('testDebugUnitTest') {
        jacoco {
            // Write a deterministic exec file path for the report task to consume.
            destinationFile = file("${buildDir}/jacoco/testDebugUnitTest.exec")
            includeNoLocationClasses = true
            excludes = ['jdk.internal.*']
        }
    }
}

// jacocoTestReport: generates the HTML/XML coverage report and then triggers
// the per-package coverage verification as a finalizer so CI fails on breach.
task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    reports {
        // Gradle 8 API (U-004 used the Gradle-7 .enabled which was removed in Gradle 8 / U-002 uplift)
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(files(["${project.projectDir}/src/main/java"]))
    // U-032: Hilt @AndroidEntryPoint applies ASM byte-code transformation to service classes
    // (SmsBackupService, SmsRestoreService, App) at test execution time via
    // transformDebugUnitTestClassesWithAsm. JaCoCo exec data is from transformed classes;
    // using only the pre-ASM javac dirs produces "classes do not match" for service classes.
    // Fix: use both the ASM-transformed dir (for correct service class matching) AND the
    // original javac/kotlin dirs (for mail/auth/other packages), but EXCLUDE the Hilt-transformed
    // classes from the javac dir to prevent duplicate entries that cause "do not match" errors.
    // U-019: include Kotlin compiled classes alongside Java classes
    classDirectories.setFrom(files([
            fileTree(dir: "${buildDir}/intermediates/classes/debugUnitTest/transformDebugUnitTestClassesWithAsm/dirs",
                     excludes: jacocoFileFilter + ['**/*Test*.class']),
            fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
                     excludes: jacocoFileFilter + [
                         // Exclude service/App classes covered by ASM dir to prevent "do not match"
                         '**/service/SmsBackupService.class',
                         '**/service/SmsRestoreService.class',
                         '**/smssync/App.class',
                     ]),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug",
                     excludes: jacocoFileFilter)
    ]))
    // U-005: use the deterministic exec path written by the testDebugUnitTest jacoco {} block
    executionData.setFrom(files(["${buildDir}/jacoco/testDebugUnitTest.exec"]))

    // Trigger coverage verification after the report; build fails non-zero on breach
    finalizedBy 'jacocoTestCoverageVerification'
}

// jacocoTestCoverageVerification: enforces >= 70% LINE coverage independently
// on each of the three gated packages (service/**, mail/**, auth/**).
// Each rule is a separate block so a breach names the specific offending package.
//
// U-006 glob fix: JaCoCo PACKAGE element 'includes' uses slash-separated class-path
// patterns matched against package names. The PREVIOUS pattern 'service/**' matched
// ONLY sub-packages (service/state, service/exception) but NOT 'service' itself —
// because '**' requires at least one path separator character after 'service/', so
// the package named exactly 'com/zegoggles/smssync/service' was excluded and the
// gate was a FALSE GREEN (verified: gate passed at service=65.1%, mail=67.4%,
// auth=35.5% before this fix).
//
// FIX: Use 'service*' (without trailing slash) which matches the package itself
// ('service') AND its sub-packages ('service/state', 'service/exception') because
// the trailing '*' matches zero or more characters including '/'. This is the
// correct JaCoCo glob form for "this package and all descendants".
//
// Verification: after this fix, jacocoTestCoverageVerification FAILS at the above
// pre-backfill coverage numbers (confirming the gate is now real), and then PASSES
// once the U-006 characterization tests bring each package to >= 70%.
task jacocoTestCoverageVerification(type: JacocoCoverageVerification, dependsOn: ['testDebugUnitTest']) {
    sourceDirectories.setFrom(files(["${project.projectDir}/src/main/java"]))
    // U-032: Use combined dirs — same fix as jacocoTestReport above.
    // ASM-transformed dir: contains the Hilt-transformed service classes that match exec data.
    // javac dir: provides mail/auth/other classes NOT in the ASM dir (no transformations for those).
    // Service/App classes in javac dir are EXCLUDED (they would cause "classes do not match"
    // because exec data was produced against the ASM-transformed versions).
    // U-019: include Kotlin compiled classes alongside Java classes
    classDirectories.setFrom(files([
            fileTree(dir: "${buildDir}/intermediates/classes/debugUnitTest/transformDebugUnitTestClassesWithAsm/dirs",
                     excludes: jacocoFileFilter + ['**/*Test*.class']),
            fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes",
                     excludes: jacocoFileFilter + [
                         // Exclude service/App classes covered by ASM dir to prevent "do not match"
                         '**/service/SmsBackupService.class',
                         '**/service/SmsRestoreService.class',
                         '**/smssync/App.class',
                     ]),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug",
                     excludes: jacocoFileFilter)
    ]))
    executionData.setFrom(files(["${buildDir}/jacoco/testDebugUnitTest.exec"]))

    violationRules {
        // Rule 1: service root package + sub-packages (state, exception).
        // U-006 glob fix: JaCoCo PACKAGE element uses DOT-separated package names, not
        // slash-separated paths. The ORIGINAL 'com/zegoggles/smssync/service/**' was in
        // slash format AND the '**' only matched packages under 'service/' (not 'service'
        // itself), producing a FALSE GREEN. The corrected pattern 'com.zegoggles.smssync.service*'
        // (dot notation, trailing '*') matches 'service' AND 'service.state' AND
        // 'service.exception' — each evaluated as a separate package with its own 70% limit.
        // VERIFIED: gate fails at service=65.1%, service.state=68.5%, service.exception=68.8%
        // before U-006 backfill. Passes after backfill brings each to >= 70%.
        rule {
            element = 'PACKAGE'
            includes = ['com.zegoggles.smssync.service*']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
        // Rule 2: mail root package (no sub-packages). Dot notation matches 'mail' exactly
        // (trailing '*' would also catch future sub-packages like 'mail.mime').
        rule {
            element = 'PACKAGE'
            includes = ['com.zegoggles.smssync.mail*']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
        // Rule 3: auth root package (no sub-packages). Dot notation matches 'auth' exactly.
        rule {
            element = 'PACKAGE'
            includes = ['com.zegoggles.smssync.auth*']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

// U-005: The --add-opens jvmArgs block that was added as a stopgap for Robolectric 4.3.1
// incompatibility with JDK 17 has been removed. Robolectric 4.12.x handles JDK 17
// natively and no longer requires these JVM flags.
