# Robolectric global test configuration (applies to all test classes unless
# overridden by a class-level @Config annotation).
#
# sdk=29: pins tests to run against API 29 (Android 10), matching the
# compileSdkVersion in app/build.gradle. Robolectric 4.12.x requires an
# explicit sdk pin when compileSdkVersion < the highest SDK Robolectric knows
# about, to avoid resolution errors for newer shadow classes.
sdk=29
