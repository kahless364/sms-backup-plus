buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        // U-019: Kotlin plugin needed for SyncStateRepository/SyncEvent Kotlin files
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 4
        forkEvery = 100
        reports.html.required = false
        reports.junitXml.required = false
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://maven.google.com" }
        maven { url "https://jitpack.io" }
        // U-017: maven.scijava.org removed (Gate G3 — AC-7).
        // It only served firebase-jobdispatcher:0.8.6 which is now deleted.
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
