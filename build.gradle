buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        // U-019: Kotlin plugin needed for SyncStateRepository/SyncEvent Kotlin files
        // U-057: Upgraded from 1.9.25 to 2.0.21 (Kotlin 2.x K2 compiler, compatible with AGP 8.7.3).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        // U-057: KSP (Kotlin Symbol Processing) plugin — replaces kapt for Hilt annotation processing.
        // KSP 2.0.21-1.0.28 is the version matching Kotlin 2.0.21.
        // Hilt 2.51.1 supports KSP (available from Hilt 2.48+).
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.21-1.0.28'
        // U-022: Hilt Gradle plugin (must precede app/build.gradle application of
        // 'com.google.dagger.hilt.android'). Version aligned with hilt-android/hilt-compiler
        // dependencies below. 2.51.1 is compatible with AGP 8.7.3 + Kotlin 2.0.21 + JDK 17 + KSP.
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.51.1'
    }
}

allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 4
        forkEvery = 100
        reports.html.required = false
        reports.junitXml.required = false
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.google.com" }
        // U-059 (BT-005): jitpack.io removed — it was added for the original k-9
        // dependency before vendoring (U-027). k9mail-vendored is now an in-tree
        // Gradle module; jitpack.io resolves nothing and adds network round-trips
        // plus a supply-chain attack surface on every build.
        // U-017: maven.scijava.org AND mavenLocal() removed (Gate G3 — AC-7).
        // Both only served firebase-jobdispatcher:0.8.6 (from ~/.m2), now deleted.
        // The k-9 mail library is the in-tree :k9mail-vendored Gradle module (U-027),
        // not a mavenLocal artifact, so mavenLocal() is no longer needed.
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
