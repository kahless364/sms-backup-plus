buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        // U-019: Kotlin plugin needed for SyncStateRepository/SyncEvent Kotlin files
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 4
        forkEvery = 100
        reports.html.required = false
        reports.junitXml.required = false
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.google.com" }
        maven { url "https://jitpack.io" }
        // U-017: maven.scijava.org AND mavenLocal() removed (Gate G3 — AC-7).
        // Both only served firebase-jobdispatcher:0.8.6 (from ~/.m2), now deleted.
        // The k-9 mail library is the in-tree :k9mail-vendored Gradle module (U-027),
        // not a mavenLocal artifact, so mavenLocal() is no longer needed.
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
