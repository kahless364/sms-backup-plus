buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // U-060: Gradle 9.5.1 / AGP 9.0.1 / KGP 2.3.21 run the build on JDK 25 (app bytecode stays 17).
        // AGP 9.0 needs Gradle >= 9.1.0, JDK >= 17, KGP >= 2.2.10, SDK Build Tools >= 36.0.0
        // (developer.android.com/build/releases/agp-9-0-0-release-notes).
        classpath 'com.android.tools.build:gradle:9.0.1'
        // U-019: Kotlin plugin needed for SyncStateRepository/SyncEvent Kotlin files
        // U-060: KGP 2.3.21 (AGP 9 built-in Kotlin needs >= 2.2.10; declared here so a KGP newer than
        // AGP's runtime 2.2.10 is used). 2.4.x is excluded: Hilt 2.59.2 cannot read Kotlin 2.4 metadata.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
        // U-057/U-060: KSP replaces kapt for Hilt. KSP 2.3.x is KSP2-only and the first line (2.3.1+)
        // with AGP 9 built-in Kotlin support; 2.3.6 includes the Windows KSP2 recompilation fix.
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.6'
        // U-022/U-060: Hilt Gradle plugin (must precede app/build.gradle application of
        // 'com.google.dagger.hilt.android'). Version aligned with hilt-android/hilt-compiler
        // dependencies in app/build.gradle. 2.59.x is the first Hilt line with AGP 9 support.
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.59.2'
    }
}

allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 4
        forkEvery = 100
        reports.html.required = false
        reports.junitXml.required = false
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.google.com" }
        // U-059 (BT-005): jitpack.io removed — it was added for the original k-9
        // dependency before vendoring (U-027). k9mail-vendored is now an in-tree
        // Gradle module; jitpack.io resolves nothing and adds network round-trips
        // plus a supply-chain attack surface on every build.
        // U-017: maven.scijava.org AND mavenLocal() removed (Gate G3 — AC-7).
        // Both only served firebase-jobdispatcher:0.8.6 (from ~/.m2), now deleted.
        // The k-9 mail library is the in-tree :k9mail-vendored Gradle module (U-027),
        // not a mavenLocal artifact, so mavenLocal() is no longer needed.
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

// U-060 (AC-7): daemon JVM criteria are generated without download URLs (no toolchain repository configured).
tasks.named('updateDaemonJvm') { toolchainPlatforms = [] }
