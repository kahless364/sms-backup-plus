name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.x requires JDK 17 at configuration time.
      # Do NOT downgrade to JDK 11 or earlier — AGP 8 will fail immediately with:
      # "Android Gradle plugin requires Java 17 to run."
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-caches-

      - name: Run tests, lint, coverage report, and release assembly
        run: ./gradlew test lint jacocoTestReport assembleRelease

      # U-051 (TE-001): enforce per-package LINE coverage gate on all ~13 packages.
      # jacocoTestReport already finalizes jacocoTestCoverageVerification, but we
      # invoke it explicitly here so CI surfaces a clear step name on failure rather
      # than burying the breach in the report task's output.
      - name: Enforce coverage gate (jacocoTestCoverageVerification)
        run: ./gradlew :app:jacocoTestCoverageVerification
