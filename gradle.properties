# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# U-060 (AC-18): both -D flags re-verified on JDK 25 (Oracle 25.0.5) and RETAINED. They are the Windows NIO
# workaround added in U-002: SelectorProvider=WindowsSelectorProvider selects the Windows selector and
# unixdomain.tmpdir=/nonexistent stops JDK 25's Pipe/Selector from using an unusable AF_UNIX temp path
# ("Unable to establish loopback connection"). On Windows, gradlew additionally exports them via JAVA_TOOL_OPTIONS for
# the launcher JVM (only under cygwin/msys; they are Windows-specific: WindowsSelectorProvider does not exist on
# Linux JDKs and makes a JVM that opens a NIO selector throw ServiceConfigurationError); here they cover IDE/daemon
# starts that bypass gradlew. Probed on a real Linux JDK 25 (U-060 rework): a Gradle 9.5.1 daemon and a Kotlin compile
# daemon still start and compile with this line, because Gradle applies -D jvmargs after the daemon has started; the
# full app build (AGP/KSP/lint/R8) on Linux is NOT verified. If a Linux build ever fails with ServiceConfigurationError,
# override org.gradle.jvmargs in the runner's ~/.gradle/gradle.properties (user-global beats project).
# NOTE: a user-global ~/.gradle/gradle.properties org.gradle.jvmargs REPLACES this line (project value is ignored).
org.gradle.jvmargs=-Xmx2048m -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider -Djdk.net.unixdomain.tmpdir=/nonexistent
org.gradle.daemon=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

android.useAndroidX=true
# U-059 (BT-005): android.enableJetifier removed — app is fully AndroidX; k-9 is
# vendored (k9mail-vendored) and already migrated to androidx.annotation. No
# Android Support Library artifacts remain in the dependency graph. Grep of all
# source files and gradle files confirms zero android.support.* imports.
# android.jetifier.ignorelist=.*bcprov.* also removed (ignorelist only applies when
# jetifier is enabled).
# Defaults since AGP 8 (unchanged in AGP 9): non-transitive R class and non-final res IDs.
# U-059 (BT-002): flip both flags to the modern defaults.
# nonTransitiveRClass=true: each module's R only contains its own resources.
# Grep of app/src confirms no transitive R references (no switch(R.*) statements,
# no cross-module R imports). App compiles clean with this flag.
android.nonTransitiveRClass=true
# nonFinalResIds=true: R fields are non-final (fine for app code).
# Grep of app/src confirms no switch(R.*) statements that require compile-time
# constant R values. App compiles clean with this flag.
android.nonFinalResIds=true
# U-057: android.javaCompile.suppressSourceTargetDeprecationWarning removed.
# Was added in U-015 to suppress the "source/target 8 is obsolete" warning for the app module.
# Now that the app compiles at VERSION_17 (U-057), the
# warning no longer fires for :app. U-060: on JDK 25 the vendored Java 8 module DOES emit it (no -Werror there; recorded as deprecation debt).
