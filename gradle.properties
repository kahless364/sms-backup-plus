# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider -Djdk.net.unixdomain.tmpdir=/nonexistent
org.gradle.daemon=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true
# https://github.com/robolectric/robolectric/issues/5299
android.jetifier.ignorelist=.*bcprov.*
# AGP 8 enables non-transitive R classes by default; disable for S2 to preserve
# switch(R.id.*) statements without requiring source changes at this stage.
android.nonTransitiveRClass=false
# AGP 8 uses non-final res IDs in the compile-time R class (R.jar), which breaks
# switch(R.id.*) because switch cases require compile-time constants. Disable
# non-final res IDs for S2 to avoid source changes.
android.nonFinalResIds=false
# U-057: android.javaCompile.suppressSourceTargetDeprecationWarning removed.
# Was added in U-015 to suppress the JDK 17 "source/target 8 is obsolete" warning.
# Now that sourceCompatibility/targetCompatibility are both VERSION_17 (U-057), the
# obsolete-source warning no longer fires and this property is unnecessary.
