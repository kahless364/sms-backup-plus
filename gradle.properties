# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider -Djdk.net.unixdomain.tmpdir=/nonexistent
org.gradle.daemon=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

android.useAndroidX=true
# U-059 (BT-005): android.enableJetifier removed — app is fully AndroidX; k-9 is
# vendored (k9mail-vendored) and already migrated to androidx.annotation. No
# Android Support Library artifacts remain in the dependency graph. Grep of all
# source files and gradle files confirms zero android.support.* imports.
# android.jetifier.ignorelist=.*bcprov.* also removed (ignorelist only applies when
# jetifier is enabled).
# AGP 8 defaults: non-transitive R class and non-final res IDs.
# U-059 (BT-002): flip both flags to AGP-8 modern defaults.
# nonTransitiveRClass=true: each module's R only contains its own resources.
# Grep of app/src confirms no transitive R references (no switch(R.*) statements,
# no cross-module R imports). App compiles clean with this flag.
android.nonTransitiveRClass=true
# nonFinalResIds=true: R fields are non-final (fine for app code).
# Grep of app/src confirms no switch(R.*) statements that require compile-time
# constant R values. App compiles clean with this flag.
android.nonFinalResIds=true
# U-057: android.javaCompile.suppressSourceTargetDeprecationWarning removed.
# Was added in U-015 to suppress the JDK 17 "source/target 8 is obsolete" warning.
# Now that sourceCompatibility/targetCompatibility are both VERSION_17 (U-057), the
# obsolete-source warning no longer fires and this property is unnecessary.
