apply plugin: 'com.android.library'

android {
    namespace 'com.fsck.k9.mail'
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 21
    }

    // for using Apache HTTP Client (webdav/ package)
    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // avoid "Duplicate files copied in APK META-INF/"
    packaging {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'LICENSE.txt'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Original: compile 'org.apache.james:apache-mime4j-core:0.7.2' (jcenter)
    // 'api' (not 'implementation') because app/src directly imports
    // org.apache.james.mime4j.codec.EncoderUtil (Sanitizer.java:3).
    // Original k-9 used 'compile' scope which is equivalent to 'api'.
    api 'org.apache.james:apache-mime4j-core:0.7.2'
    // Original: compile 'org.apache.james:apache-mime4j-dom:0.7.2' (jcenter)
    api 'org.apache.james:apache-mime4j-dom:0.7.2'
    // Original: compile 'commons-io:commons-io:2.4' (jcenter)
    // 'api' because app/src directly imports org.apache.commons.io.IOUtils
    // (Attachment.java:13, MessageConverter.java:39).
    api 'commons-io:commons-io:2.4'
    // Original: compile 'com.jcraft:jzlib:1.0.7' (jcenter; also on mavenCentral)
    implementation 'com.jcraft:jzlib:1.0.7'
    // Original: compile 'com.beetstra.jutf7:jutf7:1.0.0' (jcenter)
    implementation 'com.beetstra.jutf7:jutf7:1.0.0'
    // Original: compile "com.android.support:support-annotations:${androidSupportLibraryVersion}"
    // Replaced with AndroidX equivalent (same annotations API, migrated in AGP 8 uplift).
    api 'androidx.annotation:annotation:1.7.1'
}
