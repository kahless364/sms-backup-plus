apply plugin: 'com.android.library'

android {
    namespace 'com.fsck.k9.mail'
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 21
    }

    // webdav/ is dead code in this fork (SMS Backup+ is IMAP-only).
    // Exclude it from the source set so we can drop useLibrary 'org.apache.http.legacy'.
    // U-058 (BT-003): confirmed zero production references to webdav classes outside
    // the webdav/ directory itself (grep evidence in implementation-log.md).
    sourceSets {
        main {
            java {
                // U-058 (BT-003): webdav/ package and its dependents are dead code in this
                // fork (SMS Backup+ is IMAP-only). Excluded so we can drop
                // useLibrary 'org.apache.http.legacy'.
                // Transport.java and RemoteStore.java retain the SMTP/IMAP paths only;
                // their webdav branches have been removed.
                exclude 'com/fsck/k9/mail/store/webdav/**'
                exclude 'com/fsck/k9/mail/transport/WebDavTransport.java'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // avoid "Duplicate files copied in APK META-INF/"
    packaging {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'LICENSE.txt'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Original: compile 'org.apache.james:apache-mime4j-core:0.7.2' (jcenter)
    // 'api' (not 'implementation') because app/src directly imports
    // org.apache.james.mime4j.codec.EncoderUtil (Sanitizer.java:3).
    // Original k-9 used 'compile' scope which is equivalent to 'api'.
    api 'org.apache.james:apache-mime4j-core:0.8.11'
    // Original: compile 'org.apache.james:apache-mime4j-dom:0.7.2' (jcenter)
    api 'org.apache.james:apache-mime4j-dom:0.8.11'
    // Original: compile 'commons-io:commons-io:2.4' (jcenter)
    // Bumped from 2.4 to 2.16.1 per U-058 (BT-003): security patches + maintained version.
    // 'api' because app/src directly imports org.apache.commons.io.IOUtils
    // (Attachment.java:13, MessageConverter.java:39).
    api 'commons-io:commons-io:2.16.1'
    // Original: compile 'com.jcraft:jzlib:1.0.7' (jcenter; also on mavenCentral)
    implementation 'com.jcraft:jzlib:1.0.7'
    // Original: compile 'com.beetstra.jutf7:jutf7:1.0.0' (jcenter)
    implementation 'com.beetstra.jutf7:jutf7:1.0.0'
    // Original: compile "com.android.support:support-annotations:${androidSupportLibraryVersion}"
    // Replaced with AndroidX equivalent (same annotations API, migrated in AGP 8 uplift).
    api 'androidx.annotation:annotation:1.7.1'
}
